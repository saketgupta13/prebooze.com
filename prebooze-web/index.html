<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/prebooze-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prebooze — find your next night out. Book tickets to concerts, comedy, festivals and parties from verified organizers. WhatsApp tickets, QR entry."
    />
    <meta name="google-site-verification" content="89jcaI7VGf93Uttze65CFLDCDVQHeFDoSYaci8c42nc" />
    <!-- Google tag (gtag.js) — the dataLayer/gtag() stub below is set up
         immediately (cheap: it just queues calls into an array, same as
         Google's own snippet does before the real library has loaded), but
         the actual ~165KB gtag.js file is only requested once the browser
         reports idle time, instead of racing the page's own JS/CSS/images
         for bandwidth in that first critical second. requestIdleCallback
         isn't in Safari, so it falls back to a short timeout there — either
         way this fires well before a real visitor has finished reading the
         page, so pageview coverage is effectively unaffected. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9XVPTSRC8T');

      function loadGtagScript() {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-9XVPTSRC8T';
        document.head.appendChild(s);
      }
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadGtagScript, { timeout: 4000 });
      } else {
        setTimeout(loadGtagScript, 2000);
      }
    </script>
    <link rel="canonical" href="https://prebooze.com" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prebooze" />
    <meta property="og:url" content="https://prebooze.com" />
    <meta property="og:title" content="Prebooze — Your city's events, one tap away" />
    <meta
      property="og:description"
      content="Prebooze — find your next night out. Book tickets to concerts, comedy, festivals and parties from verified organizers. WhatsApp tickets, QR entry."
    />
    <meta property="og:image" content="https://prebooze.com/prebooze-mark.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prebooze — Your city's events, one tap away" />
    <meta
      name="twitter:description"
      content="Prebooze — find your next night out. Book tickets to concerts, comedy, festivals and parties from verified organizers. WhatsApp tickets, QR entry."
    />
    <meta name="twitter:image" content="https://prebooze.com/prebooze-mark.png" />
    <!-- Self-hosted Manrope (see index.css @font-face) — preloading the
         body-text weight lets it start fetching immediately instead of
         waiting for the CSS to be parsed, which is also what keeps the
         FOUT-driven layout shift (text reflowing once the real font swaps
         in) as small and as early as possible. -->
    <link rel="preload" href="/fonts/manrope-400.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The header logo is the LCP element on most loads but was only
         discovered after the JS bundle fetched, parsed, and mounted
         <Header> — this starts the fetch from the initial HTML parse
         instead, in parallel with the JS bundle rather than after it. -->
    <link rel="preload" href="/prebooze-logo.png" as="image" />
    <title>Prebooze — Your city's events, one tap away</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
