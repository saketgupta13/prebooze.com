<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/prebooze-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prebooze — find your next night out. Book tickets to concerts, comedy, festivals and parties from verified organizers. WhatsApp tickets, QR entry."
    />
    <meta name="google-site-verification" content="89jcaI7VGf93Uttze65CFLDCDVQHeFDoSYaci8c42nc" />
    <!-- Google Tag Manager — replaces the old direct gtag.js-to-GA4
         connection (GTM will own that connection instead, via a GA4
         Configuration tag set up inside the GTM container, so GA4 keeps
         working the same as before without double-counting pageviews from
         two independent connections). The dataLayer.push below runs
         immediately — it's just an array push, no network cost, and
         gtm.start needs an accurate early timestamp for GTM's own timing
         data — but the actual gtm.js network request only fires once
         cookie consent is 'accepted' (see the consent-gate below), and even
         then is deferred until whichever of these fires first:
           1. requestIdleCallback  — the common case: loads as soon as the
              browser has spare time, usually within a few hundred ms
           2. a real interaction   — scroll/click/key/touch — loads right
              away rather than making an already-engaged visitor wait
           3. a fixed 4s timeout   — safety net so a very busy page (idle
              never fires) or a passive reader (no interaction) still gets
              tracked without an unbounded wait
         Whichever fires first wins; the rest are cancelled. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });

      window.__prebooze_loadGtm = (function () {
        var loaded = false;
        var interactionEvents = ['scroll', 'click', 'keydown', 'touchstart', 'mousemove'];

        function loadGtm() {
          if (loaded) return;
          loaded = true;
          interactionEvents.forEach(function (evt) {
            window.removeEventListener(evt, loadGtm);
          });
          var f = document.getElementsByTagName('script')[0];
          var j = document.createElement('script');
          j.async = true;
          j.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-W6R8TWJZ';
          f.parentNode.insertBefore(j, f);
        }

        // Called two ways: immediately below if consent was already
        // 'accepted' on a prior visit, or later by CookieConsent.tsx the
        // instant the guest clicks "Accept all" this visit. Either way,
        // still goes through the same idle/interaction/timeout deferral —
        // clicking Accept is itself a real interaction, so in practice it
        // loads right away without waiting the full 4s.
        return function scheduleLoadGtm() {
          interactionEvents.forEach(function (evt) {
            window.addEventListener(evt, loadGtm, { once: true, passive: true });
          });
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadGtm);
          }
          setTimeout(loadGtm, 4000);
        };
      })();

      if (localStorage.getItem('pb_cookie_consent') === 'accepted') {
        window.__prebooze_loadGtm();
      }
    </script>
    <!-- End Google Tag Manager -->
    <!-- Meta Pixel — same consent-gated, deferred-load split as GTM above:
         fbq() is a queueing stub the moment this runs (no network cost,
         safe to call immediately/from React code regardless of consent —
         nothing is actually transmitted until fbevents.js itself loads,
         which is what's gated on 'accepted' consent below). -->
    <script>
      !(function (f) {
        if (f.fbq) return;
        var n = (f.fbq = function () {
          n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
        });
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = true;
        n.version = '2.0';
        n.queue = [];
      })(window);
      fbq('init', '2110355219869761');
      fbq('track', 'PageView');

      window.__prebooze_loadFbPixel = (function () {
        var loaded = false;
        var interactionEvents = ['scroll', 'click', 'keydown', 'touchstart', 'mousemove'];

        function loadFbPixel() {
          if (loaded) return;
          loaded = true;
          interactionEvents.forEach(function (evt) {
            window.removeEventListener(evt, loadFbPixel);
          });
          var t = document.createElement('script');
          t.async = true;
          t.src = 'https://connect.facebook.net/en_US/fbevents.js';
          var s = document.getElementsByTagName('script')[0];
          s.parentNode.insertBefore(t, s);
        }

        return function scheduleLoadFbPixel() {
          interactionEvents.forEach(function (evt) {
            window.addEventListener(evt, loadFbPixel, { once: true, passive: true });
          });
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadFbPixel);
          }
          setTimeout(loadFbPixel, 4000);
        };
      })();

      if (localStorage.getItem('pb_cookie_consent') === 'accepted') {
        window.__prebooze_loadFbPixel();
      }
    </script>
    <!-- End Meta Pixel -->

    <meta name="twitter:title" content="Prebooze — Your city's events, one tap away" />
    <meta
      name="twitter:description"
      content="Prebooze — find your next night out. Book tickets to concerts, comedy, festivals and parties from verified organizers. WhatsApp tickets, QR entry."
    />
    <meta name="twitter:image" content="https://prebooze.com/prebooze-mark.png" />
    <!-- Self-hosted Manrope (see index.css @font-face) — preloading the
         body-text weight lets it start fetching immediately instead of
         waiting for the CSS to be parsed, which is also what keeps the
         FOUT-driven layout shift (text reflowing once the real font swaps
         in) as small and as early as possible. -->
    <link rel="preload" href="/fonts/manrope-400.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The header logo is the LCP element on most loads but was only
         discovered after the JS bundle fetched, parsed, and mounted
         <Header> — this starts the fetch from the initial HTML parse
         instead, in parallel with the JS bundle rather than after it. -->
    <link rel="preload" href="/prebooze-logo.png" as="image" />
    <title>Prebooze — Your city's events, one tap away</title>
